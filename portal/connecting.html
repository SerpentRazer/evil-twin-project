<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting…</title>
<style>
  body { margin:0; min-height:100vh; background:#0b1220; color:#eaf0fb;
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .box { max-width:340px; }
  .spin { width:38px; height:38px; margin:0 auto 18px; border-radius:50%;
          border:3px solid #22304d; border-top-color:#3b82f6; animation:s 0.9s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  h1 { font-size:18px; margin:0 0 6px; }
  p { color:#8fa1c2; font-size:14px; margin:0; }
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>Connecting you to the internet…</h1>
    <p>Please wait while we establish your session. This can take a few moments.</p>
  </div>
</body>
</html>
